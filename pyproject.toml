[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "asic-sim"
version = "0.2.1"
description = "Fast analytical simulator for memory-stationary LLM inference accelerators"
requires-python = ">=3.10"
authors = [{name = "afemengineer"}]
license = {text = "MIT"}
dependencies = ["textual>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
asic-sim = "asic_sim.cli:main"
asic-sim-tui = "asic_sim.compact_tui:run_tui"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
